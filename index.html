<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milan's | Scrazy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            /* Latar belakang gambar - bisa diganti di sini */
            background: url('https://i.postimg.cc/xdHRcL3d/IMG-20260604-160131-269.jpg') center/cover no-repeat fixed;
            min-height: 100vh;
        }
        /* Lapisan transparan agar teks putih terlihat jelas */
        .overlay {
            background-color: rgba(0, 0, 0, 0.55); /* Sedikit gelap agar putih kontras */
            min-height: 100vh;
            width: 100%;
        }
        /* Gaya tombol outline transparan */
        .btn-outline {
            background-color: transparent !important;
            border-width: 2px;
            border-style: solid;
            transition: all 0.3s ease;
        }
        .btn-outline:hover {
            background-color: rgba(255, 255, 255, 0.1) !important;
        }
    </style>
</head>
<body>
    <div class="overlay">
        <!-- FOTO PROFIL DI TENGAH ATAS --> 
        <div class="flex justify-center pt-10 mb-6">
            <!-- Ganti link gambar di sini untuk ubah foto profil -->
            <img id="fotoProfil" 
                 src="https://i.postimg.cc/m2dhKS51/20260531-175456.jpg" 
                 alt="Foto Profil" 
                 class="w-32 h-32 rounded-full border-4 border-white -lg object-cover">
        </div>

        <!-- KONTEN UTAMA -->
        <div class="px-6 py-4 text-center max-w-xl mx-auto">
            <h2 class="text-4xl font-bold text-white mb-3">Milan's</h2>
            <p class="text-lg text-purple-300 mb-10">Shaders editor</p>

            <!-- TOMBOL DUKUNGAN -->
            <div class="mb-12">
                <a href="https://sociabuzz.com/milanst13_/support" 
                   target="_blank" 
                   class="btn-outline w-full block py-4 rounded-full text-lg font-semibold text-yellow-400 border-yellow-400 hover:text-yellow-300 hover:border-yellow-300">
                    Suprot aku guys
                </a>
            </div>

            <!-- BAGIAN SOSIAL MEDIA -->
            <div class="text-mid mb-12">
                <h3 class="text-2xl font-bold text-white mb-5">Sosmed</h3>
                <div class="flex flex-col gap-4">
                    <!-- ✅ Warna putih terang -->
                    <a href="https://tiktok.com/@milanbtw1" 
                       target="_blank" 
                       class="btn-outline w-full block text-center py-4 rounded-full text-lg font-semibold text-white border-white hover:text-gray-200 hover:border-gray-200">
                        TikTod
                    </a>
                    <a href="https://youtube.com/@milang95?si=bgZMRM7ZGg_xrOIl" 
                       target="_blank" 
                       class="btn-outline w-full block text-center py-4 rounded-full text-lg font-semibold text-white border-white hover:text-gray-200 hover:border-gray-200">
                        YouTuberak
                    </a>
                    <a href="https://whatsapp.com/channel/0029Vb8Fzt747XeH9N0rKE2l" 
                       target="_blank" 
                       class="btn-outline w-full block text-center py-4 rounded-full text-lg font-semibold text-white border-white hover:text-gray-200 hover:border-gray-200">
                        Saluran Wats ap
                    </a>
                </div>
            </div>

            <!-- BAGIAN SHADERS -->
            <div class="text-mid">
                <h3 class="text-2xl font-bold text-white mb-5">Shaders & modpack disini ya wok</h3>
                <div class="flex flex-col gap-4">
                    <!-- ✅ Warna putih terang -->
                    <a href="https://milanzajy-arch.github.io/Kanjut99-2-/" 
                       target="_blank" 
                       class="btn-outline w-full block text-center py-4 rounded-full text-lg font-semibold text-white border-white hover:text-gray-200 hover:border-gray-200">
                        Link Shaders
                        <a href="https://milanzajy-arch.github.io/Kanjut99-3-/" 
                       target="_blank" 
                       class="btn-outline w-full block text-center py-4 rounded-full text-lg font-semibold text-white border-white hover:text-gray-200 hover:border-gray-200">
                        Link modpack
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
